services:

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation_php
    restart: unless-stopped

    volumes:
      - .:/var/www/html
      - php_vendor:/var/www/html/vendor

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: reservation_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: reservation_nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

volumes:
  mysql_data:
  php_vendor: